format = "$all"

[[battery.display]]
threshold = 25

[aws]
disabled = true

[cmd_duration]
min_time = 1_000
show_milliseconds = true
show_notifications = true
# Command that last for more than 15 seconds will be notified when finished
min_time_to_notify = 15_000

[direnv]
disabled = false
format = "via [$symbol loaded:$loaded, allowed:$allowed]($style) "
style = "bold blue"
symbol = "direnv"
allowed_msg = "🔓"
not_allowed_msg = "🔒"
denied_msg = "⛔"
loaded_msg = "✔️"
unloaded_msg = "❌"

[git_branch]
disabled = true

[guix_shell]
format = "[guix $symbol]($style)"

[kubernetes]
disabled = true

[memory_usage]
disabled = false

[status]
disabled = false
map_symbol = true

[time]
disabled = false

[custom]
[custom.git_branch]
when = true
command = "jj root >/dev/null 2>&1 || starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"

[custom.jj]
command = "prompt"
symbol = "🐦"
format = "$symbol $output"
style = "bold purple"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

[custom.tab]
description = "The current tab in the tab terminal multiplexer"
command = "tab --starship | cut --delimiter=' ' --fields=2"
when = "tab --starship"
shell = ["sh"]
format = "[$symbol $output]($style)"
style = "bold blue"
symbol = "⍄"
